name: Personal nightly

on:
  workflow_dispatch:
    inputs:
      include_prs:
        description: "Follow upstream PRs and keep them even if they close unmerged: URLs or numbers, separated by spaces or commas"
        type: string
        default: ""
      remove_prs:
        description: "Stop following selected PRs: URLs or numbers (your open PRs remain automatic)"
        type: string
        default: ""
      force:
        description: "Build now, bypassing debounce, cooldown, and unchanged failure suppression"
        type: boolean
        default: false
      stable_inputs:
        description: "Input digest already stabilized by the VPS checker (leave empty for manual runs)"
        type: string
        default: ""

concurrency:
  group: personal-nightly
  queue: max
  cancel-in-progress: false

# Candidate code runs in bundle, desktop, and verify, so they get read-only tokens and no
# PERSONAL_NIGHTLY_TOKEN. Jobs that write run only release tooling, which personal-nightly.py
# refuses to import from other authors' PRs.
permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: github.repository == 'NikitaMGrimm/t3code'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      sequence: ${{ steps.attempt.outputs.sequence }}
      phase: ${{ steps.prepare.outputs.phase }}
      ref: ${{ steps.prepare.outputs.ref }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Retain this attempt's identity for failure reporting
        id: attempt
        run: echo "sequence=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Require a token that can merge workflow changes
        env:
          PERSONAL_NIGHTLY_TOKEN: ${{ secrets.PERSONAL_NIGHTLY_TOKEN }}
        run: test -n "$PERSONAL_NIGHTLY_TOKEN"
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PERSONAL_NIGHTLY_TOKEN }}
          ref: personal-nightly
          fetch-depth: 0
      - name: Find the latest published official nightly
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp repos/pingdotgg/t3code/releases > "$RUNNER_TEMP/upstream-releases.json"
          jq -r '.[][] | select(.draft == false) | .tag_name' "$RUNNER_TEMP/upstream-releases.json" > "$RUNNER_TEMP/upstream-releases.txt"
          tag=$(awk '/^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$/ {print; exit}' "$RUNNER_TEMP/upstream-releases.txt")
          test -n "$tag"
          git fetch https://github.com/pingdotgg/t3code.git "refs/tags/$tag:refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Synchronize PRs into an isolated candidate
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONAL_NIGHTLY_SEQUENCE: ${{ steps.attempt.outputs.sequence }}
          PERSONAL_NIGHTLY_FORCE: ${{ inputs.force || false }}
          PERSONAL_NIGHTLY_STABLE_INPUTS: ${{ inputs.stable_inputs }}
          PERSONAL_NIGHTLY_INCLUDE_PRS: ${{ inputs.include_prs }}
          PERSONAL_NIGHTLY_REMOVE_PRS: ${{ inputs.remove_prs }}
        run: |
          gh api --paginate --jq '.[]' 'repos/NikitaMGrimm/t3code/releases?per_page=100' | jq -s . > "$RUNNER_TEMP/personal-releases.json"
          python3 -I scripts/personal-nightly.py prepare --sync-prs --release-index "$RUNNER_TEMP/personal-releases.json" --tag '${{ steps.upstream.outputs.tag }}'
          if test "$(jq -r .phase "$RUNNER_TEMP/personal-nightly-status.json")" = building; then
            version=$(jq -r .candidateVersion "$RUNNER_TEMP/personal-nightly-status.json")
            python3 -I scripts/personal-nightly.py notes --version "$version" --release-index "$RUNNER_TEMP/personal-releases.json" --upstream-release-index "$RUNNER_TEMP/upstream-releases.json" --notes-file "$RUNNER_TEMP/personal-nightly-notes.md"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: personal-nightly-status
          path: |
            ${{ runner.temp }}/personal-nightly-status.json
            ${{ runner.temp }}/personal-nightly-notes.md
          if-no-files-found: error

  bundle:
    needs: prepare
    if: needs.prepare.outputs.phase == 'building'
    runs-on: ubuntu-24.04
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsudDMuY29kZXMk' }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE || 't3-relay' }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID || 'hzxSgY2cH10sDU2r' }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL || 'https://relay.t3.codes' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - name: Verify the personal update boundaries
        run: |
          python3 -m unittest discover -s scripts -p 'test_personal_nightly*.py'
          vp test run scripts/install.test.ts packages/shared/src/cliRelease.test.ts packages/ssh/src/tunnel.test.ts packages/shared/src/personalUpdate.test.ts packages/client-runtime/src/state/server.test.ts apps/server/src/cloud/selfUpdate.test.ts apps/server/src/environment/ServerEnvironment.test.ts apps/server/src/auth/PairingGrantStore.test.ts apps/web/src/components/desktopUpdate.logic.test.ts apps/web/src/components/settings/ConnectionsSettings.updateTargets.logic.test.ts apps/web/src/components/sidebar/updateEverything.logic.test.ts
          vp test run apps/server/src/provider/ProviderRegistry.test.ts apps/server/src/vcs/GitVcsDriverCore.test.ts apps/web/src/components/Sidebar.logic.test.ts apps/web/src/composerDraftStore.test.ts apps/web/src/markdown-clipboard.test.ts apps/web/src/markdown-math.test.ts apps/web/src/lib/assistantTextSelection.test.ts
          vp run --filter t3 --filter @t3tools/web --filter @t3tools/desktop typecheck
      # The web package's browser project runs React tests in headless Chromium.
      - name: Install Chromium for web browser tests
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Verify the personal browser boundaries
        working-directory: apps/web
        run: vp test run --project browser src/components/PersonalUpdateStatus.browser.test.tsx src/components/ChatMarkdown.browser.test.tsx src/components/ChatMarkdown.math.browser.test.tsx src/components/chat/MermaidDiagram.browser.test.tsx src/components/chat/MessagesTimeline.browser.test.tsx src/components/chat/ThreadDetailsControl.browser.test.tsx src/markdown-clipboard.mermaid.browser.test.ts src/markdown-clipboard.math.browser.test.ts src/markdown-clipboard.math-source.browser.test.ts
      - run: node scripts/update-release-package-versions.ts '${{ needs.prepare.outputs.version }}'
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: vp run build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error

  desktop:
    needs: [prepare, bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
          - label: Windows arm64
            runner: windows-11-arm
            platform: win
            target: nsis
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            resource_key: win32-arm64
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsudDMuY29kZXMk' }}
      clerk_jwt_template: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE || 't3-relay' }}
      clerk_cli_oauth_client_id: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID || 'hzxSgY2cH10sDU2r' }}
      relay_url: ${{ vars.T3CODE_RELAY_URL || 'https://relay.t3.codes' }}
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      cli_archive: true

  verify:
    needs: [prepare, bundle, desktop]
    runs-on: ubuntu-24.04
    outputs:
      phase: ${{ steps.verify.outputs.phase }}
    steps:
      # Git 2.55 fails checkout's in-step credential removal on the vendored .repos
      # gitlinks, which have no .gitmodules URL. This job's token is read-only, as in bundle.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: personal-nightly-status
          path: ${{ runner.temp }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - name: Merge Windows updater manifests
        run: |
          node scripts/merge-update-manifests.ts --platform win release-assets/nightly-win-x64.yml release-assets/nightly-win-arm64.yml release-assets/nightly.yml
          rm release-assets/nightly-win-x64.yml release-assets/nightly-win-arm64.yml
      - name: Verify the candidate before publishing
        id: verify
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -f release-assets/nightly.yml
          test -f "release-assets/t3-$VERSION-linux-arm64.tar.gz"
          test -f "release-assets/t3-$VERSION-linux-x64.tar.gz"
          python3 -I scripts/personal-nightly.py verify
      - uses: actions/upload-artifact@v7
        if: steps.verify.outputs.phase == 'current'
        with:
          name: merged-update-manifest
          path: release-assets/nightly.yml
          if-no-files-found: error

  publish:
    needs: [prepare, verify]
    if: needs.verify.outputs.phase == 'current'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PERSONAL_NIGHTLY_TOKEN }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      # Artifacts stay outside the candidate checkout, where a tracked symlink could
      # redirect them into .git and reach this job's credentials.
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Use the verified Windows updater manifest
        run: rm "$RUNNER_TEMP/release-assets/nightly-win-x64.yml" "$RUNNER_TEMP/release-assets/nightly-win-arm64.yml"
      - uses: actions/download-artifact@v8
        with:
          name: merged-update-manifest
          path: ${{ runner.temp }}/release-assets
      - uses: actions/download-artifact@v8
        with:
          name: personal-nightly-status
          path: ${{ runner.temp }}
      - name: Publish only the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/release-assets" && sha256sum t3-* > SHA256SUMS)
          cp "$RUNNER_TEMP/personal-nightly-status.json" "$RUNNER_TEMP/release-assets/provenance.json"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > "$RUNNER_TEMP/existing-release.json"; then
            python3 -I -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/existing-release.json")); assert r["target_commitish"] == os.environ["REF"]'
            if python3 -I -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/existing-release.json")); assert r["draft"] is False'; then
              exit 0
            fi
          else
            gh release create "v$VERSION" --target "$REF" --prerelease --draft --title "Personal nightly $VERSION" --notes-file "$RUNNER_TEMP/personal-nightly-notes.md"
          fi
          gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/personal-nightly-notes.md"
          gh release upload "v$VERSION" "$RUNNER_TEMP"/release-assets/* --clobber
          git push origin "$REF:refs/heads/personal-nightly"
          gh release edit "v$VERSION" --draft=false

  status:
    needs: [prepare, bundle, desktop, verify, publish]
    if: always() && github.repository == 'NikitaMGrimm/t3code' && needs.prepare.outputs.phase != 'conflict' && needs.prepare.outputs.phase != 'waiting' && needs.prepare.outputs.phase != 'unchanged' && needs.prepare.outputs.phase != 'debouncing'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: personal-nightly
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: personal-nightly-status
          path: ${{ runner.temp }}
      - name: Record the published result
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONAL_NIGHTLY_SEQUENCE: ${{ needs.prepare.outputs.sequence }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REF: ${{ needs.prepare.outputs.ref }}
          PHASE: ${{ needs.verify.result == 'success' && needs.verify.outputs.phase == 'superseded' && 'superseded' || 'failed' }}
        run: |
          release_args=()
          if test "$PHASE" != superseded && gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > "$RUNNER_TEMP/release-result.json" && git fetch origin personal-nightly; then
            release_args=(--published-release "$RUNNER_TEMP/release-result.json")
          fi
          python3 -I scripts/personal-nightly.py status --phase "$PHASE" --version "$VERSION" --ref "$REF" "${release_args[@]}"
